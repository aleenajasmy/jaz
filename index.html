<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aleena Jasmy – Web Design Portfolio</title>
<meta name="description" content="Selected website projects by Aleena Jasmy. Click a project to open the live site.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font:16px/1.5 Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}.w{max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
header{padding:64px 0 40px;border-bottom:1px solid #ddd}
.m{font:13px "IBM Plex Mono",monospace;color:#6d6a66}
h1{font-size:clamp(40px,8vw,96px);font-weight:800;letter-spacing:-.04em;line-height:1;margin:12px 0 16px}
header p{max-width:52ch;color:#555;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px;padding:48px 0 80px}
.card{display:block;border:1px solid #ddd}.card:hover{border-color:#111}.card:focus-visible{outline:2px solid #e8590c;outline-offset:3px}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#fff}
.card div{padding:16px 18px;border-top:1px solid #ddd}.card h2{margin:0 0 4px;font-size:20px;font-weight:500}.card p{margin:0;color:#555;font-size:14px}
.tag{margin-top:10px;display:block}footer{border-top:1px solid #ddd;padding:24px 0 40px}
</style>
</head>
<body>
<header><div class="w"><p class="m">[portfolio]</p><h1>Aleena Jasmy</h1><p>UI/UX designer building responsive websites. Pick a project to open the live site.</p></div></header>
<main class="w"><div class="grid" id="g"></div></main>
<footer><div class="w m">© 2026 Aleena Jasmy</div></footer>
<script>
/* To add a project: copy a line, change the values, and put the site in its own folder. */
const projects=[
 {title:"AUREL Furniture Store",text:"Responsive e-commerce site with catalog, product pages, bag and checkout.",link:"aurel/",img:"aurel/thumb.jpg",tags:"E-commerce · Responsive"}
];
document.getElementById('g').innerHTML=projects.map(p=>`<a class="card" href="${p.link}"><img src="${p.img}" alt="${p.title} preview" loading="lazy"><div><h2>${p.title}</h2><p>${p.text}</p><span class="m tag">${p.tags}</span></div></a>`).join('');
</script>
</body>
</html>
