<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AUREL – Furniture</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#fff;--al:#fff;--fg:#111;--mu:#6d6a66;--ln:#d9d6d1;--bt:#111;--bf:#fff;--ac:#e8590c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:inherit;text-decoration:none}button,input,select{font:inherit;color:inherit}
.m{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}.s{font-size:12px}.mu{color:var(--mu)}
.w{max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--ln)}
.hd{display:flex;align-items:center;gap:24px;height:68px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.nv{display:flex;gap:28px;margin:0 auto}.nv a:hover{text-decoration:underline}
.sr{display:flex;align-items:center;background:var(--al);border-radius:99px;padding:0 14px;width:240px;border:1px solid var(--ln)}
.sr input{border:0;background:none;height:38px;width:100%;outline:0}
.ic{display:flex;gap:6px;align-items:center}
.ib{position:relative;background:none;border:0;padding:8px;cursor:pointer;display:grid;place-items:center;min-width:44px;min-height:44px}
.ib svg,.logo svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bg{position:absolute;top:4px;right:2px;background:var(--bt);color:var(--bf);border-radius:99px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center}
.mb,.mn{display:none}
.mn{flex-direction:column;gap:12px;padding:16px clamp(16px,4vw,48px) 20px;border-top:1px solid var(--ln)}.mn.on{display:flex}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1,h2,h3{margin:0;letter-spacing:-.02em}.h2{font-size:clamp(32px,6vw,64px);font-weight:800;line-height:1;text-transform:uppercase}
h3{font-size:20px;font-weight:500;margin:32px 0 12px}
.b{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 26px;border:1px solid var(--fg);background:none;cursor:pointer;font:500 13px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase}
.b.k{background:var(--bt);color:var(--bf);border-color:var(--bt)}.b.f{width:100%;margin-top:10px}
.hero{display:grid;grid-template-columns:200px 1fr 230px;gap:24px;align-items:center;padding-top:32px}
.hc{text-align:center;position:relative}.hc h1{font-size:clamp(80px,19vw,260px);font-weight:800;line-height:.9;letter-spacing:-.05em}
.ha{width:min(40%,320px);margin:-6% auto 0;position:relative}.ha img{width:100%;mix-blend-mode:multiply;display:block}.th3 img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.th3{display:flex;gap:10px;justify-content:center;margin-top:12px}
.th3 button{width:64px;height:64px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);cursor:pointer;padding:6px}.th3 button.on{border-color:var(--fg)}
.sec{padding:64px 0}.al{background:var(--al)}.sec.al{border-top:1px solid var(--ln)}
.lb{font:12px "IBM Plex Mono",monospace;color:var(--mu);margin:0 0 16px;display:flex;justify-content:space-between;align-items:center}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ct{cursor:pointer}.ct .ph{aspect-ratio:4/3}.ct p{display:flex;justify-content:space-between;margin:8px 0 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 28px}
.tabs button{border:1px solid var(--ln);background:none;border-radius:99px;padding:8px 18px;cursor:pointer}.tabs button.on{background:var(--bt);color:var(--bf);border-color:var(--bt)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.ph{background:var(--bg);position:relative;aspect-ratio:1;display:grid;place-items:center;cursor:pointer;overflow:hidden}
.al .ph,.sh .ph{background:var(--bg)}.ph img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}.ct .ph img{object-fit:cover}.zoom img{transform:scale(1.7)}
.t{position:absolute;top:10px;left:12px;color:var(--ac);font:500 12px "IBM Plex Mono",monospace;font-style:normal}
.hb{position:absolute;top:6px;right:6px;background:none;border:0;font-size:22px;color:var(--mu);cursor:pointer;min-width:44px;min-height:44px}.hb.on{color:var(--fg)}
.cr{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;font-size:13px;text-transform:uppercase}
.qa{border:1px solid var(--ln);background:none;border-radius:50%;width:32px;height:32px;cursor:pointer;flex:none}
.cd s,.pt s{color:var(--mu);font-weight:400}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}.ab .ph{aspect-ratio:1}
.bs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
footer{background:#0b0b0a;color:#e9e6e1;margin-top:0}.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;padding:56px 0 32px}
footer a{display:block;color:#bdb8b0;padding:3px 0}footer input{background:none;border:0;border-bottom:1px solid #555;color:#fff;height:40px;width:100%;margin-top:12px}
footer p{margin:0}
.sh{display:grid;grid-template-columns:220px 1fr;gap:32px;padding-bottom:64px}.sb label{display:flex;gap:8px;padding:5px 0}.sb h4{margin:24px 0 8px;font-weight:500}
.sb input[type=range]{width:100%}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.bar select{background:var(--bg);border:1px solid var(--ln);padding:8px;min-height:40px}.fb{display:none}.ctr{text-align:center;margin-top:32px}
.pg{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;padding:24px 0 56px}.pg .ph{aspect-ratio:1;background:var(--al);cursor:default}.pg .ph{border:1px solid var(--ln)}
.pt{display:flex;gap:10px;margin-top:10px}.pt button{flex:1;aspect-ratio:1.4;background:var(--al);border:1px solid var(--ln);cursor:pointer;display:grid;place-items:center;font-size:12px;padding:0}.pt button.on{border-color:var(--fg)}.pt img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
.spin img{animation:sp 4s linear infinite}@keyframes sp{to{transform:perspective(700px) rotateY(360deg)}}
@media(prefers-reduced-motion:reduce){.spin img{animation:none}}
.info{border:1px solid var(--ln);border-radius:14px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.info small{display:block;color:var(--mu)}
.ch{display:flex;gap:8px;flex-wrap:wrap}.ch button{border:1px solid var(--ln);background:none;padding:8px 14px;cursor:pointer;min-height:40px}.ch button.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
details{border-top:1px solid var(--ln);padding:14px 0}details:last-of-type{border-bottom:1px solid var(--ln)}summary{cursor:pointer;font-weight:500;text-transform:uppercase;letter-spacing:.04em;font-size:13px}details p{color:var(--mu);margin:10px 0 0}
.qt{display:inline-flex;border:1px solid var(--fg);border-radius:6px;align-items:center}.qt button{background:none;border:0;min-width:36px;min-height:36px;cursor:pointer;font-size:18px}.qt span{min-width:24px;text-align:center}
.cl{display:grid;grid-template-columns:1fr 360px;gap:48px;padding-bottom:64px;align-items:start}
.li{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid var(--ln)}.li .i{flex:1 1 200px}.li .th{width:90px;height:90px;background:var(--al);border-radius:8px;display:grid;place-items:center;cursor:pointer}.li .th{border:1px solid var(--ln);overflow:hidden}.li .th img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
.lp{min-width:90px;text-align:right}.lp small{display:block;color:var(--mu);font-weight:400}
.lk{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;color:var(--mu)}
.sm{background:var(--bg);border:1px solid var(--ln);border-radius:16px;padding:24px}.row{display:flex;justify-content:space-between;padding:6px 0}.tot{font-size:20px}hr{border:0;border-top:1px solid var(--ln);margin:10px 0}
.r2c{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fm input:not([type=radio]){width:100%;height:48px;border:1px solid var(--ln);border-radius:24px;padding:0 18px;background:var(--bg)}.fm input.bad{border-color:#d33}
.ro{display:flex;align-items:center;gap:10px;border:1px solid var(--ln);border-radius:24px;padding:12px 18px;margin-bottom:10px;cursor:pointer}.ro b{margin-left:auto;font-weight:500;font-size:13px}
.cp{display:flex;gap:8px;margin:16px 0}.cp input{flex:1;height:44px;border:1px solid var(--ln);padding:0 12px;background:var(--bg)}
.tr{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:32px 0 56px}
.ctr2{text-align:center;padding:96px 0}
#t{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--bt);color:var(--bf);padding:12px 20px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:50}#t.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:1024px){.hero{grid-template-columns:150px 1fr 180px}.cg{grid-template-columns:repeat(2,1fr)}.cl{grid-template-columns:1fr 320px;gap:28px}}
@media(max-width:860px){.nv,.sr{display:none}.mb{display:grid}.logo{margin-right:auto}.hero{grid-template-columns:1fr}.hero .l{display:none}.r2{text-align:center}.ab,.pg,.cl{grid-template-columns:1fr}.sh{grid-template-columns:1fr}.sb{display:none}.sb.on{display:block}.fb{display:inline-flex}.fg{grid-template-columns:1fr 1fr}.sec{padding:40px 0}.mn .sr{display:flex;width:100%}}
@media(max-width:560px){.g,.bs{grid-template-columns:1fr 1fr;gap:12px}.tr,.r2c{grid-template-columns:1fr}.cg{grid-template-columns:repeat(2,1fr)}.cr{font-size:11px}.fg{grid-template-columns:1fr}.lp{text-align:left}}
</style>
</head>

</div>

<main id="app"></main>

<details open><summary>Description</summary><p>${p.name}: handcrafted from natural materials to bring warmth, character and timeless elegance to your space.</p></details><details><summary>Care instructions</summary><p>Dust with a soft dry cloth. Wipe spills right away. Keep out of direct sunlight.</p></details><details><summary>Durability</summary><p>Solid construction with a protective oil finish, made to last for years of daily use.</p></details>
<button class="b k f" onclick="add(${p.id},sel.f,sel.s,sel.n,1);go('checkout')">Buy now</button><button class="b f" onclick="add(${p.id},sel.f,sel.s,sel.n)">Add to bag</button></div></div></section>
<section class="sec al"><div class="w"><p class="lb">[explore]</p><h2 class="h2" style="margin-bottom:24px">You might also like</h2><div class="bs">${P.filter(x=>x.id!=p.id).slice(0,3).map(card).join('')}</div></div></section>`},
wishlist:()=>`<section class="w sec"><h1 class="h2">Wishlist</h1><div class="g" style="margin-top:24px">${wish.length?wish.map(i=>card(pr(i))).join(''):'<p class="mu">Tap the heart on any product to save it here.</p>'}</div></section>`,
cart:()=>!cart.length?`<section class="w ctr2"><h1 class="h2">Your bag is empty</h1><p class="mu">Add a piece you like and it will appear here.</p><a class="b k" href="#shop">Continue shopping</a></section>`:`<section class="w"><div style="padding:40px 0 24px"><p class="lb">[shopping bag]</p><h1 style="font-size:36px">Review your selections</h1></div><div class="cl"><div>${cart.map((l,i)=>{const p=pr(l.id);return `<div class="li"><div class="th" onclick="go('product-${p.id}')">${art(p)}</div><div class="i"><b>${p.name}</b><p class="m s mu" style="margin:2px 0">${F[l.f]} / ${Z[l.s].split(' ')[0]}</p><button class="lk m s" onclick="rm(${i})">REMOVE</button></div><div class="qt"><button onclick="qty(${i},-1)" aria-label="Fewer">−</button><span class="m">${l.n}</span><button onclick="qty(${i},1)" aria-label="More">+</button></div><b class="lp">${money(lp(l)*l.n)}${l.n>1?`<small class="m s">(${money(lp(l))} each)</small>`:''}</b></div>`}).join('')}<p style="margin-top:20px"><a class="m s" style="text-decoration:underline" href="#shop">← CONTINUE SHOPPING</a></p></div>${sumH(0)}</div></section>`,
checkout:()=>!cart.length?V.cart():`<section class="w"><h1 style="font-size:36px;padding:40px 0 0">Checkout</h1><div class="cl"><div class="fm"><h3>Contact Information</h3><div class="r2c">${f('fn','First name')}${f('ln','Last name')}${f('em','Email address','email')}${f('ph','Phone number','tel')}</div><h3>Delivery Method</h3><label class="ro"><input type="radio" name="dl" checked onchange="ship=0;um()"> Standard delivery (5–6 days)<b>FREE over $500, else $20</b></label><label class="ro"><input type="radio" name="dl" onchange="ship=1;um()"> Express delivery (1–2 days)<b>+$10</b></label><h3>Shipping Information</h3><div class="r2c">${f('co','Country')}${f('ci','City')}${f('ad','Address')}${f('pc','Postal code')}</div><h3>Payment Method</h3><label class="ro"><input type="radio" name="py" checked onchange="sp(0)"> Credit or debit card<b>VISA / MASTERCARD</b></label><div id="cf" class="r2c" style="margin-bottom:10px">${f('cn','Card number')}${f('ch','Cardholder full name')}${f('ex','Expiry date (MM/YY)')}${f('cv','CVV')}</div><label class="ro"><input type="radio" name="py" onchange="sp(1)"> Google Pay</label><label class="ro"><input type="radio" name="py" onchange="sp(2)"> PayPal</label><button class="b k f" onclick="place()">Place order</button><a class="b f" href="#shop">Continue shopping</a></div><div>${cart.map(l=>{const p=pr(l.id);return `<div class="li"><div class="th" style="width:64px;height:64px">${art(p)}</div><div class="i"><b>${p.name}</b><p class="m s mu" style="margin:0">${F[l.f]} / ${Z[l.s].split(' ')[0]} × ${l.n}</p></div><b>${money(lp(l)*l.n)}</b></div>`}).join('')}<div class="cp"><input id="cc" placeholder="Coupon code (try AUREL10)" aria-label="Coupon code"><button class="b" onclick="coup()">Apply</button></div><div id="sum">${sumH(1)}</div></div></div><div class="tr w"><p><b>Free shipping</b><br><span class="mu">On orders above $500</span></p><p><b>Flexible payment</b><br><span class="mu">Multiple payment options</span></p><p><b>24/7 support</b><br><span class="mu">We support online all day</span></p></div></section>`,
done:()=>{const o=S('ao',null);return `<section class="w ctr2"><p class="lb" style="justify-content:center">[order confirmed]</p><h1 class="h2">Thank you</h1>${o?`<p style="margin:16px 0">Order <b class="m">${o.no}</b> · ${o.n} item${o.n>1?'s':''} · ${money(o.total)}<br><span class="mu">A confirmation would be sent to ${o.email}. This is a demo, so no email is sent.</span></p>`:''}<a class="b k" href="#shop">Keep shopping</a></section>`},
info:k=>{const i=INFO[k]||INFO.faq;return `<section class="w sec"><h1 class="h2">${i[0]}</h1><p class="mu" style="max-width:60ch;margin-top:16px">${i[1]}</p></section>`}};
function sg(){let l=P.filter(p=>(!cats.length||cats.includes(p.cat))&&pp(p)<=maxp&&(!q||p.name.toLowerCase().includes(q)));if(so)l.sort((a,b)=>so=='lo'?pp(a)-pp(b):pp(b)-pp(a));$('#cnt').textContent=`Showing ${Math.min(shown,l.length)} of ${l.length} results`+(q?` for “${q}”`:'');$('#sg').innerHTML=l.slice(0,shown).map(card).join('')||'<p class="mu">No products match. Try clearing a filter.</p>';$('#lm').innerHTML=l.length>shown?'<button class="b" onclick="shown+=6;sg()">Load more</button>':''}
function cf(k,on){cats=on?[...cats,k]:cats.filter(x=>x!=k);shown=6;sg()}
const um=()=>{$('#sum').innerHTML=sumH(1)};
function sp(i){pay=i;$('#cf').style.display=i?'none':''}
function coup(){if(v('cc').toUpperCase()=='AUREL10'){cp=1;um();toast('Coupon applied: 10% off')}else toast('That code isn’t valid. Try AUREL10')}
function place(){let ok=1;const bad=(id,c)=>{$('#'+id).classList.toggle('bad',c);if(c)ok=0};['fn','ln','co','ci','ad','pc'].forEach(i=>bad(i,!v(i)));bad('em',!/^\S+@\S+\.\S+$/.test(v('em')));if(!pay){bad('cn',v('cn').replace(/\s/g,'').length<13);bad('ch',!v('ch'));bad('ex',!/^\d\d\/\d\d$/.test(v('ex')));bad('cv',!/^\d{3,4}$/.test(v('cv')))}
if(!ok){toast('Fix the highlighted fields to place your order');return}
W('ao',{no:'AU-'+(100000+Math.floor(Math.random()*900000)),total:calc(1).total,email:v('em'),n:cart.reduce((a,l)=>a+l.n,0)});cart=[];cp=0;ship=0;save();go('done')}
let cur='';
function view(){const[a,b]=cur.split('-');const k=a=='about'?'home':a;$('#app').innerHTML=(V[k]||V.home)(b);if(k=='shop')sg()}
function route(){cur=location.hash.slice(1)||'home';sel={f:0,s:0,n:1,i:0};pay=0;$('#mn').classList.remove('on');view();if(cur=='about')$('#about').scrollIntoView();else scrollTo(0,0)}
addEventListener('hashchange',route);save();route();
</script>
